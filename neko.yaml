# ==============================================================================
# Neko Virtual Browser Configuration
# Production Low-Latency & Tunnel-Compatible Setup
# ==============================================================================

server:
  proxy: true
  cors:
    - "*"

member:
  provider: "noauth"

desktop:
  screen: "1280x720@30"

capture:
  video:
    codec: "h264"
    # Ultra-low latency H.264 stream shared by all viewers with baseline hardware decoding
    ids: [main]
    pipelines:
      main:
        # Dynamic framerate following Neko screen mode (up to 60fps)
        fps: "fps > 60 ? 60 : fps"
        gst_prefix: "! video/x-raw,format=I420"
        gst_encoder: "x264enc"
        gst_params:
          threads: "2"
          sliced-threads: "true"
          bitrate: "height >= 1080 ? 14000 : 1800"
          key-int-max: "height >= 1080 ? 60 : fps * 2"
          # Keep full recovery frames, but avoid an I/P quality jump in Interact.
          ip-factor: "height >= 1080 ? 1.4 : 1.0"
          byte-stream: "true"
          tune: "zerolatency"
          speed-preset: "ultrafast"
          bframes: "0"
          rc-lookahead: "0"
          # Rate-control headroom, not a fixed playback delay. 40ms starved keyframes.
          vbv-buf-capacity: "height >= 1080 ? 600 : 120"
        gst_suffix: "! video/x-h264,profile=baseline,stream-format=byte-stream"
        show_pointer: false

webrtc:
  epr: "52000-52100"
  nat1to1: ""
  iceservers:
    # Backend ICE servers (Neko container -> browser)
    backend:
      - urls:
          - "stun:stun.l.google.com:19302"
          - "stun:stun1.l.google.com:19302"
          - "stun:stun2.l.google.com:19302"
          - "stun:stun3.l.google.com:19302"
          - "stun:stun4.l.google.com:19302"
      - urls:
          - "turn:openrelay.metered.ca:443?transport=tcp"
          - "turn:openrelay.metered.ca:80"
          - "turn:openrelay.metered.ca:443"
        username: "openrelayproject"
        credential: "openrelayproject"
    # Frontend ICE servers (browser -> Neko container)
    frontend:
      - urls:
          - "stun:stun.l.google.com:19302"
          - "stun:stun1.l.google.com:19302"
          - "stun:stun2.l.google.com:19302"
          - "stun:stun3.l.google.com:19302"
          - "stun:stun4.l.google.com:19302"
      - urls:
          - "turn:openrelay.metered.ca:443?transport=tcp"
          - "turn:openrelay.metered.ca:80"
          - "turn:openrelay.metered.ca:443"
        username: "openrelayproject"
        credential: "openrelayproject"
