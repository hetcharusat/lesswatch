# ==============================================================================
# Neko Virtual Browser Configuration
# Production Low-Latency & Tunnel-Compatible Setup
# ==============================================================================

server:
  proxy: true
  cors:
    - "*"

member:
  provider: "noauth"

desktop:
  screen: "1280x720@30"

video:
  bitrate: 3072
  max_fps: 30
  codec: "vp8"

webrtc:
  epr: "52000-52100"
  nat1to1: ""
  iceservers:
    # Backend ICE servers (Neko container -> browser)
    backend:
      - urls:
          - "stun:stun.l.google.com:19302"
          - "stun:stun1.l.google.com:19302"
          - "stun:stun2.l.google.com:19302"
          - "stun:stun3.l.google.com:19302"
          - "stun:stun4.l.google.com:19302"
      - urls:
          - "turn:openrelay.metered.ca:443?transport=tcp"
          - "turn:openrelay.metered.ca:80"
          - "turn:openrelay.metered.ca:443"
        username: "openrelayproject"
        credential: "openrelayproject"
    # Frontend ICE servers (browser -> Neko container)
    frontend:
      - urls:
          - "stun:stun.l.google.com:19302"
          - "stun:stun1.l.google.com:19302"
          - "stun:stun2.l.google.com:19302"
          - "stun:stun3.l.google.com:19302"
          - "stun:stun4.l.google.com:19302"
      - urls:
          - "turn:openrelay.metered.ca:443?transport=tcp"
          - "turn:openrelay.metered.ca:80"
          - "turn:openrelay.metered.ca:443"
        username: "openrelayproject"
        credential: "openrelayproject"
