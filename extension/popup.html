<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Together - Pink Edition</title>
  <style>
    :root {
      --pink: #ff2a85;
      --pink-dark: #be185d;
      --bg: #110d16;
      --bg-card: rgba(255, 42, 133, 0.08);
      --border: rgba(255, 42, 133, 0.25);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff2a85, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 8px rgba(255, 42, 133, 0.4);
    }

    .user-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .user-pill.active {
      border-color: var(--pink);
      background: rgba(255, 42, 133, 0.2);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.3);
    }

    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff2a85, #db2777);
      border: none;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

    .quick-links {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .quick-link-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px;
      color: var(--pink);
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .quick-link-btn:hover {
      background: rgba(255, 42, 133, 0.15);
      border-color: var(--pink);
    }

    .status-msg {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      color: #10b981;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo">
    <div>
      <h1>Watch Together 🌸</h1>
      <p style="font-size: 11px; color: var(--muted);">HiAnime & Movie Sync</p>
    </div>
  </div>

  <div class="form-group">
    <label>Who Are You?</label>
    <div class="user-select-grid">
      <div class="user-pill active" id="pill-prince" data-user="Prince" data-avatar="👑" data-color="#ff2a85">
        <span>👑</span> Prince
      </div>
      <div class="user-pill" id="pill-friend" data-user="Friend" data-avatar="🌸" data-color="#f472b6">
        <span>🌸</span> Friend
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Room Code</label>
    <input type="text" id="input-room" value="lounge" placeholder="e.g. lounge, anime-night" />
  </div>

  <div class="form-group">
    <label>EC2 Server URL</label>
    <input type="text" id="input-server" value="http://35.154.133.16" />
  </div>

  <button class="save-btn" id="btn-save">Save & Sync Now ✨</button>
  <div class="status-msg" id="status-text">Ready to sync on any site!</div>

  <div class="quick-links">
    <a href="https://hianime.to" target="_blank" class="quick-link-btn">🎌 Open HiAnime</a>
    <a href="http://35.154.133.16" target="_blank" class="quick-link-btn">🍿 Open Theater</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
