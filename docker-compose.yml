services:
  watch-together:
    build: .
    container_name: watch-together
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${DOWNLOADS_PATH:-./downloads}:/app/downloads
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOWNLOADS_DIR=/app/downloads
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-watchtogether}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-change-this-to-a-long-random-secret-key}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL:-}
      - VAULT_SECRET=${VAULT_SECRET:-}
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}
      - NEKO_CONTAINER_NAME=${NEKO_CONTAINER_NAME:-neko}
      - NEKO_URL=${NEKO_URL:-http://neko:8080}
      - NEKO_PASSWORD=${NEKO_PASSWORD:-admin}
      - NEKO_ADMIN_PASSWORD=${NEKO_ADMIN_PASSWORD:-admin}
    depends_on:
      - livekit
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-watchtogether}: ${LIVEKIT_API_SECRET:-change-this-to-a-long-random-secret-key}"

  neko:
    image: m1k1o/neko:chromium
    container_name: ${NEKO_CONTAINER_NAME:-neko}
    profiles: ["neko"]
    restart: "no"
    shm_size: "2gb"
    expose:
      - "8080"
    ports:
      - "52000-52100:52000-52100/udp"
    volumes:
      - ./neko.yaml:/etc/neko/neko.yaml:ro
    environment:
      - NEKO_SCREEN=1920x1080@30
      - NEKO_DESKTOP_SCREEN=1920x1080@30
      - NEKO_PASSWORD=${NEKO_PASSWORD:-admin}
      - NEKO_PASSWORD_ADMIN=${NEKO_ADMIN_PASSWORD:-admin}
      - NEKO_MEMBER_PROVIDER=noauth
      - NEKO_MEMBER_MULTIUSER_USER_PASSWORD=${NEKO_PASSWORD:-admin}
      - NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD=${NEKO_ADMIN_PASSWORD:-admin}
      - NEKO_PROXY=true
      - NEKO_SERVER_PROXY=true
      - NEKO_CORS=*
      - NEKO_SERVER_CORS=*
      - NEKO_EPR=52000-52100
      - NEKO_WEBRTC_EPR=52000-52100
      - NEKO_ICELITE=0
      - NEKO_WEBRTC_ICELITE=0
      - NEKO_NAT1TO1=${NEKO_NAT1TO1:-}
      - NEKO_WEBRTC_NAT1TO1=${NEKO_NAT1TO1:-}
      - NEKO_WEBRTC_ICESERVERS_FRONTEND=${NEKO_WEBRTC_ICESERVERS_FRONTEND:-[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:openrelay.metered.ca:443?transport=tcp","turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],"username":"openrelayproject","credential":"openrelayproject"}]}
      - NEKO_WEBRTC_ICESERVERS_BACKEND=${NEKO_WEBRTC_ICESERVERS_BACKEND:-[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:openrelay.metered.ca:443?transport=tcp","turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],"username":"openrelayproject","credential":"openrelayproject"}]}
      - NEKO_WEBRTC_ICESERVERS=${NEKO_WEBRTC_ICESERVERS_BACKEND:-[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:openrelay.metered.ca:443?transport=tcp","turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],"username":"openrelayproject","credential":"openrelayproject"}]}
      - NEKO_ICESERVERS=${NEKO_WEBRTC_ICESERVERS_BACKEND:-[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:openrelay.metered.ca:443?transport=tcp","turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],"username":"openrelayproject","credential":"openrelayproject"}]}

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-:80}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
      - NEKO_UPSTREAM=${NEKO_UPSTREAM:-neko:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - watch-together
      - livekit

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wt-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    network_mode: "host"
    command: tunnel --no-autoupdate --url http://127.0.0.1:${PORT:-3000}
    depends_on:
      - watch-together

volumes:
  caddy_data:
  caddy_config:
