services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - watch-together

  watch-together:
    build: .
    container_name: watch-together
    restart: always
    expose:
      - "3000"
    volumes:
      - ./server.js:/app/server.js
      - ./public:/app/public
      - ./data:/app/data
      - ./downloads:/app/downloads
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3000
      - NODE_ENV=production

volumes:
  caddy_data:
  caddy_config:
